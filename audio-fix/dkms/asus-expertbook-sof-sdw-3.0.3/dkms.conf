PACKAGE_NAME="asus-expertbook-sof-sdw"
PACKAGE_VERSION="3.0.3"
AUTOINSTALL="yes"

# Linux 7.3 carries the quirk itself (90af3209742d) and a newer sof_sdw than
# this 7.2-level copy, so DKMS must not build it there on kernel upgrades.
# Before 6.19 no machine driver matches this laptop's codecs
# (ptl_cs42l43_agg_l3_cs35l56_l2), so there is no card to fix, and the 6.18
# LTS cannot build this copy since 6.18.55 backported the 7.3 sdw_utils API.
BUILD_EXCLUSIVE_KERNEL="^(6\.19|7\.[0-2])\."

BUILT_MODULE_NAME[0]="snd-soc-sof-sdw"
DEST_MODULE_LOCATION[0]="/updates"

# No LLVM=1 here: DKMS appends it by itself when the target kernel was built
# with Clang (CachyOS ThinLTO kernels). Forcing it breaks GCC-built kernels
# such as linux-cachyos-lts 6.18.52 or stock Arch.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
