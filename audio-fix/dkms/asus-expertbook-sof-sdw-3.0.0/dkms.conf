PACKAGE_NAME="asus-expertbook-sof-sdw"
PACKAGE_VERSION="3.0.0"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="snd-soc-sof-sdw"
DEST_MODULE_LOCATION[0]="/updates"

# CachyOS kernels use Clang/ThinLTO and need LLVM=1. Arch's stock `linux`
# package is GCC-built, so forcing LLVM=1 there mixes clang with GCC-only
# compiler flags baked into the kernel's build config and fails. Match
# whichever toolchain actually built the running kernel.
if grep -q "^CONFIG_CC_IS_CLANG=y" "/lib/modules/${kernelver}/build/.config" 2>/dev/null; then
  MAKE_LLVM_FLAG="LLVM=1"
else
  MAKE_LLVM_FLAG=""
fi
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules ${MAKE_LLVM_FLAG}"
