name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')
      - name: Test keyboard backlight event handling
        run: python3 -m unittest discover -s tests -v
      - name: Test the mute LED installer and synchronizer
        run: python3 -m unittest discover -s mute-led-fix/tests -v
