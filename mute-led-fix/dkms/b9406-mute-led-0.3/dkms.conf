PACKAGE_NAME="b9406-mute-led"
PACKAGE_VERSION="0.3"
BUILT_MODULE_NAME[0]="b9406_mute_led"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Linux 7.4 registers platform::mute with this trigger. Do not build there.
# asus-wmi exports the devstate calls this driver uses from 6.19 on, and
# before 6.19 this laptop has no sound card for the LED to follow anyway.
BUILD_EXCLUSIVE_KERNEL="^(6\.19|7\.[0-3])\."
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
