PACKAGE_NAME="b9406-mute-led"
PACKAGE_VERSION="0.2"
BUILT_MODULE_NAME[0]="b9406_mute_led"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Linux 7.4 registers platform::mute with this trigger. Do not build there.
BUILD_EXCLUSIVE_KERNEL="^(6\.|7\.[0-3]\.)"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
