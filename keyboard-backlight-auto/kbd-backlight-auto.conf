# Configuration for kbd-backlight-auto.
#
# Every value below is the built-in default, shown commented out. Uncomment a
# line to override it. Restart after editing:
#
#     sudo systemctl restart kbd-backlight-auto
#
# To see what the daemon is doing without it touching the backlight:
#
#     sudo kbd-backlight-auto --probe -v
#     sudo kbd-backlight-auto --status

# Master switch. With "no" the service starts and exits immediately, leaving
# the backlight entirely to the Fn keys and the KDE slider.
#enabled = yes

# Keyboard LED to drive.
#led = /sys/class/leds/asus::kbd_backlight

# How often the ambient sensor is sampled, in seconds.
#interval = 1.0

# Low-pass filter bandwidth in Hz, from GNOME's gsd-power-manager.c. Smaller is
# smoother, larger reacts faster to abrupt light changes. The filter time
# constant is 1 / (2*pi*bandwidth), so 0.1 Hz is about 1.6 seconds.
#bandwidth_hz = 0.1

# Multiplier applied to the sensor's lux reading before the curve is consulted.
# Leave at 1.0 unless the sensor reads consistently low or high compared with a
# reference meter - the curve's thresholds are absolute lux values, so a
# mis-scaled sensor puts the keyboard in the wrong bucket. Raise it if the
# keyboard stays lit in a bright room, lower it if it switches off too early.
#calibration = 1.0

# The bucketized ambient light response curve, as "<minlux>:<maxlux>:<percent>"
# triples - the same format and the same default values as Windows 11's
# HKLM\SOFTWARE\Microsoft\Lighting\Backlight\BacklightAutobrightnessBucketMapping.
#
# Buckets must be contiguous or overlapping (no gaps) and each needs
# minlux < maxlux; an invalid curve falls back to this default. The overlaps
# are deliberate - they are what gives the curve its hysteresis, so a reading
# sitting on a boundary cannot flap between two levels.
#
# The shape is intentionally not monotonic: dim rather than blazing in the
# dark, brightest in the 40-100 lux range, and off above 200-300 lux where
# ambient light alone makes the keycaps readable.
#curve = 0:6:35, 5:14:52, 12:32:70, 30:45:88, 40:100:100, 95:110:88, 105:160:70, 155:205:52, 200:300:0

# Manual-override lookup table, as "<minlux>:<maxlux>:<lower>:<upper>" 4-tuples
# - again Windows 11's default (BacklightAutobrightnessManualOverrideLut).
#
# Pressing an Fn backlight key is meant to hand control back to you: the daemon
# stops writing until the ambient reading leaves a window built around the
# reading at the moment you pressed it. At 120 lux the entry 40:150:0.60:0.60
# gives the window 120*(1-0.6) to 120*(1+0.6), i.e. 48-192 lux. Entries must be
# contiguous and non-overlapping.
#
# NOTE: the Fn backlight keys on this machine emit no input event at all - the
# EC swallows them. The daemon picks them up from the LED's
# brightness_hw_changed attribute instead, which is also how UPower notices and
# how KDE's on-screen display gets raised. That attribute reports the real
# level, so the override starts from what you actually chose.
#
# To stop the daemon touching the backlight entirely, set enabled = no above,
# or run: sudo systemctl stop kbd-backlight-auto
#override_lut = 0:20:1.00:1.00, 20:40:0.70:0.60, 40:150:0.60:0.60, 150:600:0.50:0.50, 600:1000:0.40:0.40, 1000:4000:0.30:0.25, 4000:10000:0.20:0.20, 10000:30000:0.15:0.10, 30000:100000:0.10:0.10

# Re-write the chosen level this often, in seconds, even when nothing changed.
# The LED cannot be read back, so anything else that writes it - the desktop
# blanking the keyboard with the display and restoring it on unlock, a script
# calling brightnessctl - is invisible to the daemon and would otherwise stand
# until the next curve change. Costs one sysfs write per interval. 0 disables.
#reassert = 5

# Switch the backlight off while the lid is shut. Closing the lid also drops
# any active manual override, so the curve takes over again on reopen.
#lid_off = yes
